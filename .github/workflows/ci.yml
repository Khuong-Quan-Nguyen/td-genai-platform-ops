name: CI

# Deployment is handled by Vercel's native Git integration, which builds and
# ships every push to main. This workflow is the quality gate that runs
# alongside it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Import check
        run: python -c "import main, models, security, agent, audit"

      - name: Vercel entrypoint check
        run: python -c "from main import app; print(type(app).__name__)"

      - name: Run tests
        run: pytest -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Verify build output
        run: test -f static/index.html && echo "SPA built OK"
